# Your tuning lives here. Loaded with:
#   ros2 run team_driver driver --ros-args --params-file \
#       /hackathon/race_ws/src/team_driver/config/driver_params.yaml
#
# or in an evaluation run:
#   ./scripts/evaluate.sh --team my_team \
#       --driver-params /hackathon/race_ws/src/team_driver/config/driver_params.yaml
#
# KEEP THESE IN STEP WITH DEFAULT_PARAMS IN driver.py. A run started without
# this file (plain `ros2 run team_driver driver`, or evaluate.sh without
# --driver-params) uses the defaults in the code, not these.

driver:
  ros__parameters:
    vehicle_ns: /autodrive/roboracer_1
    max_range: 10.0               # [m] clip the scan here; the LiDAR reaches 10 m

    # --- Path -------------------------------------------------------------
    # x, y CSV in the world frame, traced by scripts/track_tool.py centerline.
    path_file: /hackathon/maps/icra26_compete_centerline.csv

    # --- Pure pursuit -----------------------------------------------------
    lookahead_min: 0.6            # [m]
    lookahead_gain: 0.15          # [s]  ld = lookahead_min + gain * speed
    lookahead_max: 1.5            # [m]
    wheelbase: 0.324              # [m]
    max_steer_rad: 0.5236         # [rad] what steering_command = 1.0 means

    # --- Speed controller -------------------------------------------------
    # throttle = k_ff * v_target + kp * error + ki * integral(error)
    v_target: 1.5                 # [m/s] constant for the baseline
    k_ff: 0.05                    # [throttle per m/s] a first guess; calibrate it
    kp: 0.10                      # [throttle per m/s]
    ki: 0.05                      # [throttle per m]
    integral_limit: 0.10          # [throttle] max contribution of the I term
    throttle_min: 0.0             # floor when slightly fast: lift off, do not brake
    throttle_max: 0.30
    overspeed_margin: 1.0         # [m/s] only this much too fast allows braking
    brake_throttle: -0.10         # floor when badly too fast

    # --- Safety -----------------------------------------------------------
    safety_distance: 0.8          # [m] closest LiDAR return straight ahead
    safety_half_angle_deg: 10.0   # [deg] "straight ahead" is +-this
    safety_speed: 0.5             # [m/s] target speed cap while too close
