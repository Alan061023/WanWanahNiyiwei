    v_corner: 3.2
    v_hairpin: 1.9
    preview_dist: 2.8
    hairpin_preview_dist: 2.8
    corner_angle_thresh: 0.60
    hairpin_angle_thresh: 1.60
    k_ff: 0.13
    kp: 0.14
    ki: 0.04
    integral_limit: 0.12
    throttle_min: 0.0
    throttle_max: 0.70
    overspeed_margin: 1.25
